name: deploy-pages

# main への push で、静的ファイルを GitHub Pages に公開する。
# 事前に リポジトリの Settings → Pages → Build and deployment で "GitHub Actions" を選んでおく。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # 配信に必要なものだけを _site に集める（テスト・ビルド用のスクリプト、元データは含めない）
      - name: 公開するファイルを集める
        run: |
          mkdir _site
          cp index.html _site/
          cp -r src _site/
          # 各ライセンス文書はサイトから辿れるようにする（index.html のリンク先）
          cp LICENSE LICENSES.md _site/
          cp -r licenses _site/
          # データ・フォントは Pages が gzip 配信するので、そのまま置く
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
